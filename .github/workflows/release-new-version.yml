name: Create a New Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - feature
          - yearly
          - rc

run-name: "Release ${{ inputs.bump }} bump on ${{ github.ref_name }}"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: valkyrjaio/.github/.github/workflows/_create-ts-release.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}
      dependencies: |
        [
          {"name": "Root and Suggested CI", "directory": ".github/ci/root-and-suggested"},
          {"name": "TypeScript",            "directory": ".github/ci/typescript"},
          {"name": "ESLint",               "directory": ".github/ci/eslint"},
          {"name": "Prettier",             "directory": ".github/ci/prettier"},
          {"name": "Vitest",               "directory": ".github/ci/vitest"}
        ]
      info-file-path: src/Sindri/Constant/SindriInfo.ts
      info-file-name: SindriInfo

  publish:
    needs: release
    uses: valkyrjaio/.github/.github/workflows/_ts-release-npm-publish.yml@983eb086a57533c52b7ce86a29b2d537aad838ed
    secrets: inherit
